name: Verify ERD and migrations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: module07assignment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify renderer failure and recovery
        run: |
          printf 'erDiagram\n  INVALID ||-- broken\n' > /tmp/invalid.mmd
          set +e
          node .agent/skills/erd-generator/scripts/render_erd.js /tmp/invalid.mmd > /tmp/render-error.log 2>&1
          status=$?
          set -e
          cat /tmp/render-error.log
          test "$status" -eq 1
          grep -q SYNTAX_ERROR /tmp/render-error.log
          test ! -e docs/architecture/erd.svg
          node .agent/skills/erd-generator/scripts/render_erd.js docs/architecture/schema.mmd
      - name: Run migration, rollback, and reapply
        run: |
          npm run migrate:up
          npm run migrate:down
          npm run migrate:up
          npm run migrate:down
          npm run migrate:down
      - name: Verify constraints against PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/module07assignment
        run: node --import tsx --test tests/library-migration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: library-erd
          path: docs/architecture/erd.svg
